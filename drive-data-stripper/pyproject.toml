[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drive-data-stripper"
version = "0.1.0"
description = "Strip proprietary data and metadata from files before sharing them with a frontier model, with a guided CLI and reversible scaffolding."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "click>=8.1",
    "Pillow>=10.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "cryptography>=41.0",
]

[project.scripts]
drive-strip = "drive_stripper.cli:cli"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["drive_stripper*"]
