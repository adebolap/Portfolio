[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drive-data-stripper"
version = "0.3.0"
description = "Strip proprietary data and metadata from files before sharing them with a frontier model, with a guided CLI and reversible scaffolding."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "adebolap" }]
keywords = [
    "privacy",
    "data-loss-prevention",
    "llm",
    "redaction",
    "metadata",
    "security",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1",
    "Pillow>=10.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "cryptography>=41.0",
]

[project.urls]
Homepage = "https://github.com/adebolap/Portfolio/tree/main/drive-data-stripper"
Repository = "https://github.com/adebolap/Portfolio"
Changelog = "https://github.com/adebolap/Portfolio/blob/main/drive-data-stripper/CHANGELOG.md"

[project.scripts]
drive-strip = "drive_stripper.cli:cli"

[project.optional-dependencies]
ocr = ["pytesseract>=0.3"]
web = ["flask>=3.0"]
dev = ["pytest>=7.0", "pytesseract>=0.3", "flask>=3.0"]

[tool.setuptools.packages.find]
include = ["drive_stripper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
